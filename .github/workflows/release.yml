name: Release

# Push a tag like v0.2.0 (matching .version in build.zig.zon) to publish a
# GitHub release with static Linux binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the version string
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test
        run: zig build test
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in x86_64-linux-musl aarch64-linux-musl; do
            # Fails if the tag doesn't match the version in build.zig.zon.
            zig build -Doptimize=ReleaseSafe -Dtarget=$target --prefix "out/$target"
            name="edidrandr-$version-$target"
            mkdir "$name"
            cp "out/$target/bin/edidrandr" README.md "$name/"
            if [ -f LICENSE ]; then cp LICENSE "$name/"; fi
            tar -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Check version
        run: |
          actual="$(out/x86_64-linux-musl/bin/edidrandr --version)"
          expected="edidrandr ${GITHUB_REF_NAME#v}"
          echo "$actual"
          test "$actual" = "$expected"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes $prerelease \
            --title "edidrandr $GITHUB_REF_NAME"
